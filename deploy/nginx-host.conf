# ============================================================================
#  Reverse proxy HOST + TLS untuk UC Centers.
#
#  Ini BUKAN nginx/nginx.conf (yang di dalam kontainer). File ini dipasang di
#  Nginx milik server, di depan kontainer, dan bertugas menangani HTTPS.
#
#  Pasang:
#    sudo cp deploy/nginx-host.conf /etc/nginx/sites-available/uccenters
#    sudo ln -s /etc/nginx/sites-available/uccenters /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
#  Ganti SEMUA kemunculan uccenters.uc.ac.id dengan domain sebenarnya.
#  Sertifikatnya diterbitkan Certbot — lihat deploy/setup-server.sh.
# ============================================================================

# ── HTTP: hanya untuk verifikasi Certbot dan pengalihan ke HTTPS ────────────
server {
    listen 80;
    listen [::]:80;
    server_name uccenters.uc.ac.id;

    # Certbot menaruh berkas tantangan di sini; jalur ini TIDAK boleh ikut
    # dialihkan, kalau tidak perpanjangan sertifikat otomatis akan gagal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ───────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name uccenters.uc.ac.id;

    ssl_certificate     /etc/letsencrypt/live/uccenters.uc.ac.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uccenters.uc.ac.id/privkey.pem;

    # Hanya TLS 1.2 ke atas. TLS 1.0/1.1 sudah tidak dianggap aman.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    server_tokens off;

    # HSTS: paksa browser memakai HTTPS pada kunjungan berikutnya.
    #
    # PERHATIAN: setelah header ini terkirim, browser MENOLAK membuka domain
    # ini lewat HTTP selama 2 tahun — termasuk bila sertifikatnya bermasalah.
    # Nyalakan hanya setelah HTTPS terbukti stabil beberapa hari. Untuk uji
    # coba awal, turunkan max-age ke 300 dulu.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Ukuran unggahan harus >= client_max_body_size di kontainer (12M),
    # kalau tidak berkas 10 MB ditolak di sini sebelum sampai aplikasi.
    client_max_body_size 12M;

    location / {
        # Kontainer nginx hanya mendengarkan di loopback (lihat
        # docker-compose.prod.yml), jadi tidak bisa dijangkau dari internet
        # kecuali lewat blok ini.
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # WAJIB "https": tanpa ini NextAuth mengira koneksinya HTTP dan tidak
        # menandai cookie sesi sebagai Secure.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $http_connection;

        proxy_read_timeout 60s;
    }
}

# Dipakai blok di atas agar WebSocket tetap bisa upgrade tanpa memutus
# keep-alive pada request HTTP biasa.
map $http_upgrade $http_connection {
    default upgrade;
    ''      close;
}
