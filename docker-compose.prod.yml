# ============================================================================
#  Overlay PRODUKSI (server UC).
#
#  Pakai dengan MEMBUANG override development, kalau tidak port database ikut
#  terbuka ke internet:
#
#    docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
#  Perhatikan `-f` yang eksplisit: menyebut file secara manual membuat Docker
#  Compose TIDAK memuat docker-compose.override.yml secara otomatis. Itulah
#  yang menutup port 3310 (MySQL) dan 3100 (app) dari luar.
# ============================================================================

services:
  db:
    # Tanpa `ports:`, MySQL hanya bisa dihubungi dari dalam jaringan Docker
    # `uc-net`. Untuk mengaksesnya dari laptop, gunakan terowongan SSH:
    #   ssh -L 3310:localhost:3306 user@server -N
    # atau langsung: docker compose exec db mysql -u uccenters -p uccenters
    ports: !override []
    environment:
      # Password root wajib diganti; nilai contoh ditolak Compose.
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD wajib diisi di .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi dan diganti dari nilai contoh}
    security_opt:
      - no-new-privileges:true

  app:
    ports: !override []
    environment:
      NODE_ENV: production
      # Wajib diisi di .env; aplikasi menolak melayani request bila kosong.
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET wajib diisi (openssl rand -base64 32)}
      # Wajib domain HTTPS produksi, bukan localhost — dipakai NextAuth untuk
      # membentuk URL callback dan menentukan cookie aman.
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL wajib diisi, mis. https://uccenters.uc.ac.id}
      # DATABASE_URL ditulis ulang di sini, bukan cuma menyetel DB_PASSWORD:
      # nilainya sudah dirakit di docker-compose.yml, jadi menaruh DB_PASSWORD
      # di blok environment app saja tidak berpengaruh apa pun.
      DATABASE_URL: mysql://${DB_USER:-uccenters}:${DB_PASSWORD:?DB_PASSWORD wajib diisi dan diganti dari nilai contoh}@db:3306/${DB_NAME:-uccenters}
      # Seed hanya perlu jalan sekali. Setelah admin pertama dibuat dan
      # passwordnya diganti, set SKIP_SEED=true agar seed tidak menimpanya lagi.
      SKIP_SEED: ${SKIP_SEED:-false}
    # Pengerasan runtime: proses di dalam kontainer tidak butuh tambahan
    # privilege apa pun, dan filesystem image bersifat read-only.
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache

  nginx:
    # `!override` WAJIB di sini. Tanpanya, Compose MENGGABUNG daftar ports
    # dengan milik docker-compose.yml sehingga pemetaan 0.0.0.0:8090 dari file
    # dasar tetap ikut aktif dan kontainer justru terbuka ke seluruh internet.
    ports: !override
      # Port 80/443 ditangani reverse proxy host + TLS (Nginx host/Cloudflare).
      # Kontainer ini cukup mendengarkan di loopback.
      - "127.0.0.1:${WEB_PORT:-8090}:80"
    security_opt:
      - no-new-privileges:true
