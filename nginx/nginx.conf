events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    # Jangan umumkan versi Nginx di header maupun halaman error.
    server_tokens   off;

    # Kompresi aset teks — HTML/JS/CSS Next.js turun signifikan di jaringan lambat.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      application/xml image/svg+xml font/woff2;

    # Versi lama menulis `Connection 'upgrade'` secara hardcoded untuk SEMUA
    # request, termasuk request HTTP biasa yang tidak melakukan upgrade —
    # header itu memutus keep-alive ke upstream. Map ini mengirim "upgrade"
    # hanya saat klien memang meminta WebSocket.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Pembatas laju di tepi jaringan, melengkapi rate limiter di aplikasi.
    # Yang di aplikasi hidup di memori proses; yang ini menahan banjir request
    # sebelum sempat membangunkan Node sama sekali.
    limit_req_zone  $binary_remote_addr zone=login_zone:10m rate=10r/m;
    limit_req_zone  $binary_remote_addr zone=api_zone:10m   rate=120r/m;

    upstream nextjs_app {
        server app:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Cukup untuk unggahan PDF 10 MB plus overhead multipart.
        client_max_body_size 12M;

        # ── Berkas unggahan ────────────────────────────────────────────────
        # Disajikan langsung dari volume oleh Nginx (tidak lewat Node sama
        # sekali), jadi gambar tidak membebani proses aplikasi.
        #
        # Memakai `root`, bukan `alias`: dengan root, Nginx memetakan URI apa
        # adanya (/uploads/... -> /var/www/uploads/...) dan tetap menentukan
        # Content-Type dari mime.types. Versi alias+regex sebelumnya membuat
        # semua berkas terkirim sebagai application/octet-stream sehingga
        # gambar ter-download alih-alih tampil.
        #
        # Hanya ekstensi yang memang diizinkan endpoint unggah yang cocok di
        # sini; path lain di bawah /uploads/ jatuh ke blok berikutnya dan 404.
        location ~ ^/uploads/.+\.(?:jpg|jpeg|png|webp|pdf)$ {
            root /var/www;

            # Nama berkas ber-hash dan tidak pernah ditulis ulang → aman
            # di-cache lama. `expires` sengaja tidak dipakai supaya header
            # Cache-Control tidak terkirim dua kali.
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            # Berkas milik pengguna tidak boleh dieksekusi sebagai halaman.
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;

            try_files $uri =404;
        }

        location /uploads/ {
            return 404;
        }

        # ── Endpoint autentikasi: rate limit lebih ketat ───────────────────
        location /api/auth/ {
            limit_req zone=login_zone burst=10 nodelay;
            limit_req_status 429;

            proxy_pass http://nextjs_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=api_zone burst=60 nodelay;
            limit_req_status 429;

            proxy_pass http://nextjs_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location / {
            proxy_pass http://nextjs_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
