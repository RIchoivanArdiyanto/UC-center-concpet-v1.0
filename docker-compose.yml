# ============================================================================
#  UC Centers — Orchestrator 3 container
#    db    : MySQL 8                (internal)
#    app   : Next.js 14 standalone  (internal, auto migrate + seed saat start)
#    nginx : reverse proxy          (satu-satunya pintu ke host)
#
#  Jalankan : docker compose up -d --build
#  Stop     : docker compose down          (volume data DB tetap aman)
#  Konfig   : salin .env.example -> .env
#
#  AUTO STARTUP: semua service memakai `restart: unless-stopped`, jadi setiap
#  Docker Desktop / komputer dinyalakan kontainer ikut menyala sendiri tanpa
#  perlu build atau perintah manual lagi.
# ============================================================================

name: uc-centers

services:
  # ── Database ──────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: uc-mysql
    restart: unless-stopped
    # utf8mb4 WAJIB: kolasi default MySQL 8 sudah utf8mb4, tapi ditulis
    # eksplisit agar emoji dan karakter non-latin (mis. tanda pisah "–" pada
    # jam operasional) tidak berubah jadi tanda tanya.
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      # Nama tabel Prisma memakai huruf besar ("AdminUser"). Di Linux MySQL
      # peka huruf besar-kecil, di Windows/macOS tidak — nilai 0 menjaga
      # perilakunya sama di semua mesin.
      - "--lower-case-table-names=0"
      - "--max-connections=100"
    environment:
      MYSQL_DATABASE:      ${DB_NAME:-uccenters}
      MYSQL_USER:          ${DB_USER:-uccenters}
      MYSQL_PASSWORD:      ${DB_PASSWORD:-uccenters}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      TZ: Asia/Jakarta
    volumes:
      - mysql_data:/var/lib/mysql
    expose:
      - 3306
    healthcheck:
      # `mysqladmin ping` sudah balas OK sebelum database benar-benar siap
      # menerima query, jadi dipakai query sungguhan sebagai penanda sehat.
      test:
        [
          "CMD-SHELL",
          "mysql -u$$MYSQL_USER -p$$MYSQL_PASSWORD -e 'SELECT 1' $$MYSQL_DATABASE || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    mem_limit: 640m
    networks: [uc-net]

  # ── Aplikasi Next.js ──────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: uc-centers-app:latest
    container_name: uc-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy    # tunggu MySQL siap sebelum migrate
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      TZ: Asia/Jakarta
      DATABASE_URL: mysql://${DB_USER:-uccenters}:${DB_PASSWORD:-uccenters}@db:3306/${DB_NAME:-uccenters}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET wajib diisi di file .env}
      NEXTAUTH_URL:    ${NEXTAUTH_URL:-http://localhost:8090}
      SEED_ADMIN_EMAIL:    ${SEED_ADMIN_EMAIL:-admin@uccenters.id}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-superadmin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Password123!}
      SKIP_SEED: ${SKIP_SEED:-false}
      UPLOAD_DIR: /app/uploads
    volumes:
      # Berkas unggahan disimpan di volume, bukan di dalam image, supaya tidak
      # ikut terhapus setiap kali image dibangun ulang.
      - uploads_data:/app/uploads
    expose:
      - 3000
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s     # beri waktu migrate + seed selesai
    mem_limit: 640m
    networks: [uc-net]

  # ── Nginx reverse proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: uc-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      # Port host 8090 dipilih supaya tidak bentrok dengan gudang-elektronik
      # (8080) maupun rsudrme (8081/8082/8083).
      - "${WEB_PORT:-8090}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Read-only: Nginx hanya menyajikan berkas, tidak pernah menulisnya.
      - uploads_data:/var/www/uploads:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 96m
    networks: [uc-net]

volumes:
  mysql_data:
  uploads_data:

networks:
  uc-net:
    driver: bridge
